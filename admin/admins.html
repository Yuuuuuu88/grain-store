<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>管理員管理｜國宏蛋行</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        "Microsoft JhengHei",
        sans-serif;
      background: #f6f4ef;
      color: #2f2b26;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      min-height: 100vh;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;

      padding: 18px 28px;

      background: #ffffff;
      border-bottom: 1px solid #e7e0d5;
    }

    .topbar h1 {
      margin: 0;
      font-size: 24px;
    }

    .topbar-actions {
      display: flex;
      gap: 10px;
    }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin: 28px auto;
    }

    .panel {
      padding: 22px;

      background: #ffffff;
      border: 1px solid #e7e0d5;
      border-radius: 18px;

      box-shadow: 0 6px 20px rgba(56, 45, 31, 0.05);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;

      margin-bottom: 18px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 21px;
    }

    .panel-header p {
      margin: 6px 0 0;
      color: #776f66;
      font-size: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 40px;
      padding: 9px 16px;

      border: 0;
      border-radius: 10px;

      transition:
        opacity 0.2s,
        transform 0.2s;
    }

    .btn:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    .btn-primary {
      background: #755c3b;
      color: #ffffff;
    }

    .btn-secondary {
      background: #eee9e0;
      color: #3d352b;
    }

    .btn-edit {
      background: #eee7da;
      color: #604a2d;
    }

    .btn-enable {
      background: #e5f4e8;
      color: #267039;
    }

    .btn-disable {
      background: #f9e4e4;
      color: #a33a3a;
    }

    .btn-small {
      min-height: 34px;
      padding: 7px 11px;
      font-size: 14px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th,
    td {
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid #eee8de;
      vertical-align: middle;
    }

    th {
      color: #756a5d;
      font-size: 14px;
      background: #faf8f4;
    }

    td {
      font-size: 15px;
    }

    .status-badge,
    .role-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 5px 10px;
      border-radius: 999px;

      font-size: 13px;
      font-weight: 700;
    }

    .status-active {
      color: #28733a;
      background: #e8f6eb;
    }

    .status-inactive {
      color: #9d3939;
      background: #fae7e7;
    }

    .role-super {
      color: #6d471c;
      background: #f7ead6;
    }

    .role-admin {
      color: #3c526d;
      background: #e7eef7;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .empty-message {
      padding: 30px;
      color: #81786d;
      text-align: center;
    }

    .message {
      display: none;
      margin-bottom: 16px;
      padding: 12px 15px;
      border-radius: 10px;
    }

    .message.show {
      display: block;
    }

    .message.success {
      color: #236c35;
      background: #e7f6ea;
      border: 1px solid #c3e6ca;
    }

    .message.error {
      color: #973434;
      background: #fae8e8;
      border: 1px solid #efc7c7;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 20px;
      background: rgba(0, 0, 0, 0.45);
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: min(520px, 100%);
      max-height: calc(100vh - 40px);
      overflow-y: auto;

      padding: 24px;

      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.22);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;

      margin-bottom: 20px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 22px;
    }

    .close-button {
      width: 38px;
      height: 38px;

      border: 0;
      border-radius: 50%;

      background: #f0ece5;
      color: #554b3f;
      font-size: 22px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;

      font-weight: 700;
      font-size: 14px;
    }

    .required {
      color: #bb3636;
    }

    .form-control {
      width: 100%;
      height: 44px;
      padding: 0 12px;

      border: 1px solid #d8d0c4;
      border-radius: 10px;

      outline: none;
      background: #ffffff;
    }

    .form-control:focus {
      border-color: #8c704b;
      box-shadow: 0 0 0 3px rgba(140, 112, 75, 0.12);
    }

    .form-control:disabled {
      background: #f3f1ed;
      color: #898177;
    }

    .form-help {
      margin-top: 6px;
      color: #81786d;
      font-size: 13px;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;

      margin-top: 24px;
    }

    @media (max-width: 700px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
        padding: 16px;
      }

      .topbar-actions {
        width: 100%;
      }

      .topbar-actions .btn {
        flex: 1;
      }

      .container {
        width: min(100% - 20px, 1180px);
        margin: 16px auto;
      }

      .panel {
        padding: 15px;
        border-radius: 14px;
      }

      .panel-header {
        align-items: stretch;
        flex-direction: column;
      }

      .panel-header .btn {
        width: 100%;
      }

      .modal-card {
        padding: 18px;
      }

      .modal-actions {
        flex-direction: column-reverse;
      }

      .modal-actions .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="topbar">
      <h1>管理員管理</h1>

      <div class="topbar-actions">
        <a
          class="btn btn-secondary"
          href="/admin/dashboard.html"
        >
          返回後台
        </a>

        <button
          class="btn btn-primary"
          id="logoutButton"
          type="button"
        >
          登出
        </button>
      </div>
    </header>

    <main class="container">
      <div
        class="message"
        id="pageMessage"
      ></div>

      <section class="panel">
        <div class="panel-header">
          <div>
            <h2>管理員列表</h2>
            <p>新增、編輯及停用後台管理員帳號。</p>
          </div>

          <button
            class="btn btn-primary"
            id="addAdminButton"
            type="button"
          >
            ＋ 新增管理員
          </button>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>帳號</th>
                <th>顯示名稱</th>
                <th>權限</th>
                <th>狀態</th>
                <th>建立時間</th>
                <th>操作</th>
              </tr>
            </thead>

            <tbody id="adminsTableBody">
              <tr>
                <td
                  class="empty-message"
                  colspan="6"
                >
                  載入中……
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- 新增／編輯管理員視窗 -->
  <div
    class="modal"
    id="adminModal"
  >
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle">新增管理員</h2>

        <button
          class="close-button"
          id="closeModalButton"
          type="button"
          aria-label="關閉"
        >
          ×
        </button>
      </div>

      <form id="adminForm">
        <input
          id="adminId"
          type="hidden"
        >

        <div class="form-group">
          <label for="username">
            帳號
            <span class="required">*</span>
          </label>

          <input
            class="form-control"
            id="username"
            name="username"
            type="text"
            maxlength="50"
            autocomplete="username"
            required
          >

          <div class="form-help">
            只能使用英文字母、數字與底線。
          </div>
        </div>

        <div class="form-group">
          <label for="displayName">
            顯示名稱
            <span class="required">*</span>
          </label>

          <input
            class="form-control"
            id="displayName"
            name="display_name"
            type="text"
            maxlength="100"
            required
          >
        </div>

        <div class="form-group">
          <label for="role">
            權限
            <span class="required">*</span>
          </label>

          <select
            class="form-control"
            id="role"
            name="role"
            required
          >
            <option value="admin">
              一般管理員
            </option>

            <option value="super_admin">
              超級管理員
            </option>
          </select>
        </div>

        <div class="form-group">
          <label for="password">
            <span id="passwordLabel">密碼</span>
            <span
              class="required"
              id="passwordRequired"
            >
              *
            </span>
          </label>

          <input
            class="form-control"
            id="password"
            name="password"
            type="password"
            minlength="6"
            autocomplete="new-password"
          >

          <div
            class="form-help"
            id="passwordHelp"
          >
            密碼至少需要 6 個字元。
          </div>
        </div>

        <div
          class="message"
          id="modalMessage"
        ></div>

        <div class="modal-actions">
          <button
            class="btn btn-secondary"
            id="cancelButton"
            type="button"
          >
            取消
          </button>

          <button
            class="btn btn-primary"
            id="saveButton"
            type="submit"
          >
            儲存
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="/admin/js/admins.js"></script>
</body>
</html>
